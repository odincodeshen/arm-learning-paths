<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" font-family="Lato, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333e48"/>
    </marker>
    <style>
      .panel  { fill: #f7f9fa; stroke: #c6ced4; stroke-width: 1.5; }
      .dev    { fill: #ffffff; stroke: #333e48; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .node   { fill: #ffffff; stroke: #0091bd; stroke-width: 2; }
      .hw     { fill: #fff7e6; stroke: #d98c00; stroke-width: 2; }
      .source { fill: #ffffff; stroke: #7d8b96; stroke-width: 1.5; }
      .shm    { fill: #e8f6ee; stroke: #2f8f5b; stroke-width: 2; stroke-dasharray: 7 4; }
      .tb     { font-size: 15px; fill: #1d262d; font-weight: 700; }
      .ts     { font-size: 12.5px; fill: #44525d; }
      .th     { font-size: 18px; fill: #1d262d; font-weight: 700; }
      .tag    { font-size: 12px; fill: #ffffff; font-weight: 700; }
      .line   { stroke: #333e48; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect class="panel" x="10" y="10" width="980" height="250" rx="10"/>
  <text class="th" x="30" y="40">B. Local data sharing on the RDK X5</text>

  <rect class="node" x="520" y="28" width="18" height="12" rx="2"/>
  <text class="ts" x="544" y="39">CPU software</text>
  <rect class="hw" x="640" y="28" width="18" height="12" rx="2"/>
  <text class="ts" x="664" y="39">dedicated hardware</text>
  <rect class="shm" x="810" y="28" width="18" height="12" rx="2" style="stroke-dasharray:none"/>
  <text class="ts" x="834" y="39">shared memory</text>

  <rect class="dev" x="30" y="60" width="945" height="185" rx="10"/>
  <text class="tb" x="45" y="82">RDK X5 only</text>

  <rect class="source" x="50" y="125" width="120" height="70" rx="8"/>
  <text class="tb" x="110" y="154" text-anchor="middle">target.jpg</text>
  <text class="ts" x="110" y="175" text-anchor="middle">stored image</text>

  <rect class="node" x="200" y="120" width="190" height="80" rx="8"/>
  <text class="tb" x="295" y="145" text-anchor="middle">hobot_image_pub</text>
  <text class="ts" x="295" y="167" text-anchor="middle">decode → NV12 640x640</text>
  <text class="ts" x="295" y="187" text-anchor="middle">is_shared_mem:=True</text>

  <rect class="shm" x="420" y="100" width="190" height="120" rx="10"/>
  <text class="tb" x="515" y="127" text-anchor="middle">Data-sharing pool</text>
  <text class="ts" x="515" y="150" text-anchor="middle">Fast DDS · /hbmem_img</text>
  <text class="ts" x="515" y="169" text-anchor="middle">HbmMsg1080P</text>
  <rect x="430" y="185" width="170" height="22" rx="9" fill="#2f8f5b"/>
  <text class="tag" x="515" y="200" text-anchor="middle">verified data-sharing hop</text>

  <rect class="node" x="640" y="85" width="315" height="140" rx="8"/>
  <text class="tb" x="797" y="107" text-anchor="middle">dnn_node_example</text>
  <text class="ts" x="797" y="125" text-anchor="middle">is_shared_mem_sub:=1</text>
  <rect class="hw" x="655" y="135" width="90" height="70" rx="6"/>
  <text class="ts" x="700" y="161" text-anchor="middle">VSE resize</text>
  <text class="ts" x="700" y="181" text-anchor="middle">(hobot_cv)</text>
  <rect class="hw" x="755" y="135" width="80" height="70" rx="6"/>
  <text class="ts" x="795" y="161" text-anchor="middle">BPU</text>
  <text class="ts" x="795" y="181" text-anchor="middle">inference</text>
  <rect class="node" x="845" y="135" width="95" height="70" rx="6"/>
  <text class="ts" x="892" y="156" text-anchor="middle">postprocess</text>
  <text class="ts" x="892" y="173" text-anchor="middle">on Arm CPU</text>
  <text class="ts" x="892" y="190" text-anchor="middle">(main hotspot)</text>

  <path class="line" d="M170,160 L198,160"/>
  <path class="line" d="M390,160 L418,160"/>
  <path class="line" d="M610,160 L638,160"/>
</svg>
